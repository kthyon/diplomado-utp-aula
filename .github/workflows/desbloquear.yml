name: Verificar calendario del aula
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar-calendario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar fechas, permanencia y acceso
        run: node --test tests/access-policy.test.mjs
